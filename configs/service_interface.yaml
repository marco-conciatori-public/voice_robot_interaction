verbose: 0
# api key for google ai studio
api_key_file_path: /home/jetson/GIT/voice_robot_interaction/google_ai_studio/gemini_api_key.txt

use_tts_service: True
# time after which the image is no longer relevant (in seconds)
image_spoilage_time: 5

# Agentic reasoning loop: max observe-act steps the model may take for one request, and how long to
# wait (seconds) after dispatching a motion before letting the model observe its result. When a call
# carries its own 'duration' (e.g. set_movement_with_duration), that duration is added to the wait.
max_reasoning_steps: 6
action_settle_time: 1.0

# parameters for reasoning (reasoning_service)
reasoning_parameters:
  model_name: gemini-3.5-flash
  # Sent once as the model's system instruction (not repeated on every turn).
  prompt_template: |
    You are Mantis, the AI that pilots a small mobile robot. The robot has four wheels for driving and
    a 6-DOF arm with a gripper. A camera is mounted at the end of the arm and is your only eyes: you see
    nothing until you call get_camera_image, which returns the current view.

    You control the robot only through the provided functions, and you may take SEVERAL steps to satisfy
    one request. Do not give up after a single step. A good pattern is: call get_camera_image to see the
    scene, decide on a small movement, call the movement function, then call get_camera_image again to
    check how the scene changed, and repeat until the goal is reached or you are confident it cannot be.

    Notes on the functions:
    - Movements are coarse and open-loop. You get no numeric feedback, only what you see in the next
      image, so prefer small steps and re-check with the camera instead of one large blind move.
    - move_arm takes small relative steps of the gripper along x (left/right), y (forward/back) and
      z (up/down), each roughly in the range -1..1. set_movement_with_duration drives the wheels for a
      set duration. control_gripper rotates and opens/closes the gripper.
    - Depth and distance are hard to judge from a single camera, so approach targets gradually.
    - set_target only recognises a fixed list of objects (person, cat, orange) through a separate
      detector. For anything else you must guide the robot yourself using the camera.

    Attempt navigation-style tasks (for example "go toward the door you see") by breaking them into
    small look-and-move steps. If a task is genuinely beyond the robot (for example a precise grasp of a
    tiny object), say so briefly, and ask a short clarifying question when it would help. When you are
    finished, reply with one short spoken sentence and no function call.
  audio_mime_type: audio/wav
  image_mime_type: image/jpeg
  remember_history: True

# parameters for text-to-speech (tts_service)
tts_parameters:
  model_name: gemini-3.1-flash-tts-preview
  voice_name: enceladus
#  voice_name: kore
  save_file: False

# What happens when the TTS model answers 429. On the free tier that is usually the per-minute rate
# limit, which clears by itself, so TTS goes quiet for a cooldown instead of being disabled for the
# whole run. The retryDelay the server asks for wins when the error carries one.
tts_rate_limit:
  # Wait (seconds) used when the 429 carries no retryDelay.
  default_cooldown: 60
  # Ceiling for the wait. Also used directly when the 429 names a per-day quota, which will not clear
  # within any sensible cooldown.
  max_cooldown: 900
  # The wait is multiplied by this once per consecutive failure, so a limit that keeps being hit backs
  # off instead of retrying at a fixed rate. Reset by the first call that succeeds.
  backoff_factor: 2
  # Minimum gap (seconds) between two spoken notices, so the robot does not repeat itself once per
  # cooldown.
  min_notice_interval: 300
  # Pre-recorded clip played when TTS goes quiet, looked up in the assets folder. It must already be
  # mono 16 bit at the speaker sample rate (24 kHz). Leave empty to announce nothing.
  notice_audio_file_name: TTS_request_limit.wav
